name: Aum Private Gallery Android
on:
  workflow_dispatch:
  push:
    branches: [main, aum-private-gallery]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read Go and NDK versions
        run: |
          echo "GO_VERSION=$(sed -n 's/^de.felixnuesse.extract.goVersion=//p' gradle.properties)" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(sed -n 's/^de.felixnuesse.extract.ndkVersion=//p' gradle.properties)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "ndk;${NDK_VERSION}" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests, lint, and ARM64 debug APK
        run: bash scripts/build-android.sh
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aum-private-gallery-arm64-debug
          path: |
            app/build/outputs/apk/oss/debug/*arm64-v8a*-debug.apk
            app/build/outputs/apk/oss/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
